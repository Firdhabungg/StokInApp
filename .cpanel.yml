---
deployment:
  tasks:
    - export PATH=/opt/cpanel/ea-php82/root/usr/bin:$PATH
    - export COREPATH=/home/stod2594/stokinapp
    - export PUBLICPATH=/home/stod2594/public_html
    - /bin/cp -R * $COREPATH
    - /bin/cp -R public/* $PUBLICPATH
    - cd $COREPATH && composer install --no-dev --optimize-autoloader
    - cd $COREPATH && php artisan optimize:clear
    - cd $COREPATH && php artisan view:cache
    - cd $COREPATH && php artisan config:cache
    - cd $COREPATH && php artisan storage:link
    - cd $COREPATH && php artisan migrate --force